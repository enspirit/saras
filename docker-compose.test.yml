# The stack under the suites. Layered on base, never on devel.
#
# **No published ports at all.** Every suite runs inside a container on the
# compose network and reaches the product by service name — so two concurrent
# runs on one agent have nothing to fight over, and a suite cannot pass on a
# path production does not have. It is also what lets CI need nothing but
# docker.
#
# Sources are baked into the images here, not mounted: a suite run against
# mounted sources is run against something other than the artefact. And no
# suite depends on a secret: env/test.env pins everything env/devel.env would
# take from a laptop's `.env`.

services:
  saras:
    env_file:
      # After env/base.env, which docker-compose.base.yml lists. Later files win.
      - ./.env.commons
      - ./software/saras/env/devel.env
      - ./software/saras/env/test.env
