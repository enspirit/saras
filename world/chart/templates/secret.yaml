{{- $given := include "saras.givenSecrets" . | fromJson }}
{{- if $given }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "saras.fullname" . }}
  labels:
    {{- include "saras.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := $given }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
