# yaml-language-server: $schema=https://raw.githubusercontent.com/enspirit/emb/refs/heads/master/src/config/schema.json#/definitions/ComponentConfig
description: saras — the server, and the interface it serves

resources:
  image:
    type: 'docker/image'
    # The thing that ships. No registry is configured yet: an operator builds
    # it from a checkout.
    publish: true
    params:
      # The context is this directory, and the Dockerfile the one beside it.
      target: saras-development

flavors:
  production:
    patches:
      - path: /resources/image/params/target
        op: replace
        value: saras-production

  dev:
    patches:
      # What makes the image stale. Bind-mounted sources are deliberately not
      # listed — only what a watch inside the container cannot recover from.
      - path: /resources/image/rebuildTrigger
        op: add
        value:
          strategy: watch-paths
          paths:
            - software/saras/Dockerfile
            - software/saras/package.json
            - software/saras/package-lock.json

# Every task but one runs on the host, in this directory, and calls the npm
# script of the same name: package.json holds the one list of commands. On the
# host because this component has a compose service, and emb would otherwise
# exec the task into it — only when the stack happens to be up.
tasks:
  setup:
    description: Install the dependencies, as the lock file states them
    executors:
      - local
    script: npm ci

  lint:
    description: Type-check the server and the browser code
    executors:
      - local
    script: npm run typecheck

  build:
    description: Bundle what the browser loads into public/js/
    executors:
      - local
    script: npm run build

  test:
    description: Unit and integration tests. TEST_DATABASE_URL runs them on a PostgreSQL server
    executors:
      - local
    script: npm test

  test:unit:
    description: The computations, and the checks on the sources — no server started
    executors:
      - local
    script: npm run test:unit

  test:integration:
    description: The operations over HTTP, against local mail servers and a stand-in for the LLM
    executors:
      - local
    script: npm run test:integration

  start:
    description: Run the server on this machine, on the embedded database unless DATABASE_URL is set
    executors:
      - local
    script: npm start

  test:postgres:
    description: The integration tests on the stack's PostgreSQL server, as in production. Needs the running stack
    # In the saras container: it reaches the database by service name, with
    # the URL the server itself was given. Each test file works in a schema of
    # its own, so the stack's data is left alone.
    executors:
      - container
    script: TEST_DATABASE_URL="$DATABASE_URL" npm run test:integration
