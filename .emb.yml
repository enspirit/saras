# yaml-language-server: $schema=https://raw.githubusercontent.com/enspirit/emb/refs/heads/master/src/config/schema.json
project:
  name: saras

plugins:
  # **Order is precedence, and the first file wins**: dotenv never overwrites a
  # key it has already set. So `.env` is only useful for keys `.env.commons`
  # does not name, and the process environment beats both.
  - name: dotenv
    config:
      - .env.commons
      - .env

  - name: embfiles
    config:
      glob:
        # The whole map of the repository: what we write, what tests it, what
        # it runs in.
        - 'software/*/Embfile.{yaml,yml}'
        - 'tests/*/Embfile.{yaml,yml}'
        - 'world/*/Embfile.{yaml,yml}'

env:
  DOCKER_TAG: ${env:DOCKER_TAG:-latest}

defaults:
  docker:
    tag: ${env:DOCKER_TAG}

flavors:
  # The flavor `emb up` runs under. Each component's own `dev` flavor adds its
  # rebuildTrigger.
  dev: {}

  production:
    patches:
      # `:-latest` again: a patch replaces the default along with the value.
      - path: /env/DOCKER_TAG
        op: replace
        value: ${env:DOCKER_TAG:-latest}-production

# Repository-wide tasks: what CI calls. A component's own tasks live in its
# Embfile.yml; the `pre:` entries are qualified, because several components
# may define a task of the same name.
tasks:
  setup:
    description: Install what every component needs to be built and tested
    pre:
      - saras:setup

  lint:
    description: The static checks, every component
    pre:
      - saras:lint
      - compose:lint
      - harness:lint

  build:
    description: Build every component
    pre:
      - saras:build

  test:
    description: Unit and integration, every component. Needs a checkout, not a stack
    pre:
      - harness:test
      - saras:test
