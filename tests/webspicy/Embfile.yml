# yaml-language-server: $schema=https://raw.githubusercontent.com/enspirit/emb/refs/heads/master/src/config/schema.json#/definitions/ComponentConfig
description: The black-box specification of the API, driven through the front door

resources:
  image:
    type: 'docker/image'
    # Not published. This is a harness, and shipping it would put a test
    # toolchain in a registry next to the product.
    publish: false

flavors:
  dev:
    patches:
      - path: /resources/image/rebuildTrigger
        op: add
        value:
          strategy: watch-paths
          paths:
            - tests/webspicy/Dockerfile
            - tests/webspicy/Gemfile
            - tests/webspicy/Gemfile.lock

tasks:
  test:webspicy:
    description: The whole black-box suite, against the running stack
    # Named `test:webspicy` rather than `test`, deliberately: it needs a
    # *running stack*, where `emb run test` needs only a checkout.
    #
    # It runs inside the container (this component has a compose service), so
    # it reaches saras by service name.
    vars:
      TAG: ${env:TAG:-}
      RESOURCE: ${env:RESOURCE:-}
      LOG_LEVEL: ${env:LOG_LEVEL:-INFO}
      FAILFAST: ${env:FAILFAST:-}
    script: | # shell
      for _ in $(seq 60); do
        curl -fs "${SARAS_API}/api/public" >/dev/null 2>&1 && break
        sleep 1
      done
      bundle exec webspicy config.rb

  test:webspicy:one:
    description: One specification, by path — e.g. S=api/public/get.yml
    # `S` is a pattern matched against the path, not an argument to webspicy:
    # a file argument resolves its configuration by walking up, and with a
    # scoped config.rb runs the whole suite while saying it runs one file.
    vars:
      S: ${env:S:-api/public/get.yml}
      LOG_LEVEL: ${env:LOG_LEVEL:-DEBUG}
    script: RESOURCE="${S}" bundle exec webspicy config.rb
