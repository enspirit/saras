name: TryBoardFilter
agent: Member
entry: POST /api/boards/try
description: >-
  Tells a member what a filter being written would show them, before any board
  keeps it: how many emails, and the five most recent. Nothing is kept.
input: FilterGiven
output: FilterTried

DomPost:
  - (x) how many emails the filter would show the member, and the five most recent of them: >-
      count(output.emails) == min(output.count, 5) && mostRecentFirst(output.emails)
      && among(output.emails, old.emails.emails)
ReqPre:
  - (x) the requester is signed in
ReqPost:
  - (x) nothing is kept, and nothing changes: nothingChanged
  - ( ) every condition given must hold, and within one made of several values, any of them
  - ( ) the filter is tried reduced to the conditions we know
  - ( ) only the emails of mailboxes the member may use are counted

examples:
  - when: the filter has no condition
    given: test/base, as admin
    input: { filter: {} }
    then: 200
    and:
      - every email they may see, the five most recent told: >-
          output.count == count(old.emails.emails) && output.count == 20
          && ids(output.emails) == [1020, 1019, 1018, 1017, 1016]

  - when: a value of an attribute is asked for
    given: test/base, as admin
    input: { filter: { attributes: { "1002": ["2"] } } }
    then: 200
    and:
      - the emails whose Topic is Sales, wherever they stand: >-
          output.count == 3 && ids(output.emails) == [1020, 1016, 1008]
          && all(output.emails, e ~> fetch(e.attributes, '1002').value == '2')

  - when: several values of an attribute are asked for
    given: test/base, as admin
    input: { filter: { attributes: { "1002": ["1", "2"] } } }
    then: 200
    and:
      - the emails that have any of them, five of the six told: >-
          output.count == 6 && ids(output.emails) == [1020, 1018, 1016, 1010, 1008]

  - when: a box is asked for, as where an email stands
    given: test/base, as member
    input: { filter: { attributes: { status: [todo] } } }
    then: 200
    and:
      - the emails to handle: >-
          output.count == old.emails.counts.todo && output.count == 10
          && notStanding(output.emails, 'needs_reply') == []

  - when: two boxes are asked for
    given: test/base, as admin
    input: { filter: { attributes: { status: [sent, ignored] } } }
    then: 200
    and:
      - the emails of either: output.count == 3 && ids(output.emails) == [1020, 1017, 1016]

  - when: a status is named where a box is
    given: test/base, as admin
    input: { filter: { attributes: { status: [needs_reply] } } }
    then: 200
    and:
      - no email is shown: output.count == 0 && output.emails == []

  - when: a sender is asked for, by a part of their name in any case
    given: test/base, as admin
    input: { filter: { from: NORTHWIND ACCOUNTS } }
    then: 200
    and:
      - the emails they wrote: >-
          output.count == 2 && ids(output.emails) == [1018, 1001]
          && all(output.emails, e ~> e.fromName == 'Northwind Accounts')

  - when: a sender is asked for, by a part of their address
    given: test/base, as admin
    input: { filter: { from: northwind } }
    then: 200
    and:
      - the emails from it: output.count == 3 && all(output.emails, e ~> contains(e.fromAddr, 'northwind'))

  - when: keywords are asked for
    given: test/base, as admin
    input: { filter: { keywords: invoice northwind } }
    then: 200
    and:
      - the emails whose subject or text holds each of them: output.count == 2 && ids(output.emails) == [1018, 1001]

  - when: several conditions are given
    given: test/base, as admin
    input: { filter: { attributes: { status: [todo] }, from: northwind } }
    then: 200
    and:
      - the emails that meet them all: output.count == 1 && ids(output.emails) == [1001]

  - when: a condition says what an email must not be
    given: test/base, as admin
    input: { filter: { attributes: { status: [todo] }, except: { attributes: { "1002": ["1", "2"] } } } }
    then: 200
    and:
      - the emails to handle without one of these values, those without a Topic included: >-
          output.count == 7 && ids(output.emails) == [1014, 1013, 1011, 1007, 1005]
          && all(output.emails, e ~> fetch(e.attributes, '1002') == null)

  - when: a sender and keywords are excepted
    given: test/base, as admin
    input: { filter: { except: { from: northwind, keywords: facture devis } } }
    then: 200
    and:
      - the emails that are not from it and hold none of the words: >-
          output.count == 15 && ids(output.emails) == [1019, 1017, 1015, 1014, 1013]

  - when: a mailbox is asked for
    given: test/base, as admin
    input: { filter: { mailbox: [1001] } }
    then: 200
    and:
      - the emails that arrived in it: output.count == 20

  - when: a mailbox is asked for that is nobody's
    given: test/base, as admin
    input: { filter: { mailbox: [9999] } }
    then: 200
    and:
      - no email is shown: output.count == 0

  - when: recent emails are asked for
    given: test/base, as admin
    input: { filter: { received: 1 } }
    then: 200
    and:
      - the emails that arrived in the last day: output.count == 10

  - when: emails with attachments are asked for
    given: test/base, as admin
    input: { filter: { attachment: true } }
    then: 200
    and:
      - the emails that came with a file: output.count == 2 && ids(output.emails) == [1018, 1003]

  - when: emails without attachments are asked for
    given: test/base, as admin
    input: { filter: { attachment: false } }
    then: 200
    and:
      - the others: output.count == 18

  - when: the filter names an attribute by what is no number
    given: test/base, as admin
    input: { filter: { keywords: invoice, attributes: { colour: [red] } } }
    then: 200
    and:
      - it shows what the conditions we know keep: output.count == 2 && ids(output.emails) == [1018, 1001]

  - when: the organisation has no mailbox
    given: test/unconnected, as admin
    input: { filter: {} }
    then: 200
    and:
      - no email is shown: output.count == 0 && output.emails == []

  - when: somebody who may use no mailbox tries a filter without a condition
    given: test/base, as outsider
    input: { filter: {} }
    then: 200
    and:
      - no email of another organisation is shown: output.count == 0 && output.emails == []
