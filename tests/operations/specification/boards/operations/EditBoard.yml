name: EditBoard
agent: Member
entry: PUT /api/boards/:id
description: >-
  The one who manages a board changes its name, its filter, or whether it is
  shared. What is given replaces what was kept, whole.
input: BoardChanged
output: Board

DomPre:
  - (x) it is a board the member sees
DomPost:
  - (x) the board has this name and this filter, for the conditions we know, and is shared or not: >-
      output.id == input.id && output.name == input.name && output.shared == input.shared
      && sameFilter(output.filter, input.filter)
ReqPre:
  - (x) the requester is signed in
  - (x) the member manages it, as its owner or, for a shared one, as an administrator
  - (x) only an administrator makes it shared
ReqPost:
  - (x) the member is listed the board as they are answered it, when they still see it: >-
      !seesBoard(output.id) || board(output.id) == output
  - (x) the other boards are as they were: >-
      among(without(old.boards, input.id), boards)
      && count(without(boards, input.id)) == count(old.boards) - 1
  - (+) no board is made, none is deleted: ids(db.boards) == ids(old.db.boards)
  - ( ) a shared board made personal again stays with who made it

examples:
  - when: an administrator renames a shared board and gives it another filter
    given: test/base, as admin
    input: { id: 1001, name: Invoices, shared: true, filter: { keywords: invoice } }
    then: 200
    and:
      - it shows the emails its new filter keeps: output.count == 2
      - every member sees it as it is now, and does not manage it: >-
          let theirs = seenBy.member.board(1001)
          in theirs.name == 'Invoices' && theirs.shared && !theirs.canManage && theirs.filter == output.filter
      - nobody of another organisation does: "!seenBy.outsider.seesBoard(1001)"

  - when: an administrator changes a shared board another administrator made
    given: test/base, as coadmin
    input: { id: 1001, name: Billing and sales, shared: true, filter: { attributes: { "1002": ["1", "2"] } } }
    then: 200
    and:
      - it shows the emails with one of these values: output.count == 6 && output.canManage

  - when: a member changes their own board
    given: test/base, as member
    input: { id: 1003, name: To handle, shared: false, filter: { attributes: { status: [todo] }, except: { from: northwind } } }
    then: 200
    and:
      - it shows the emails to handle that this sender did not write: output.count == 9 && output.canManage
      - it is still theirs alone: "!seenBy.admin.seesBoard(1003)"

  - when: an administrator shares a board of their own
    given: test/base, as admin
    input: { id: 1002, name: From customers, shared: true, filter: { from: example } }
    then: 200
    and:
      - every member now sees it, and does not manage it: seenBy.member.board(1002).shared && !seenBy.member.board(1002).canManage
      - every other administrator manages it: seenBy.coadmin.board(1002).canManage
      - nobody of another organisation sees it: "!seenBy.outsider.seesBoard(1002)"

  - when: an administrator makes personal again a shared board they made
    given: test/base, as admin
    input: { id: 1001, name: Billing, shared: false, filter: { attributes: { "1002": ["1"] } } }
    then: 200
    and:
      - it is theirs alone: >-
          !board(1001).shared && board(1001).canManage
          && !seenBy.member.seesBoard(1001) && !seenBy.coadmin.seesBoard(1001)

  - when: an administrator makes personal again a shared board another administrator made
    given: test/base, as coadmin
    input: { id: 1001, name: Billing, shared: false, filter: { attributes: { "1002": ["1"] } } }
    then: 200
    and:
      - it stays with who made it: "!seenBy.admin.board(1001).shared && seenBy.admin.board(1001).canManage"
      - who changed it is answered a board they do not manage, and no longer sees it: >-
          !output.canManage && !seesBoard(1001)
      - no other member sees it: "!seenBy.member.seesBoard(1001)"

  - when: a shared board is given no condition, and is made personal
    given: test/base, as admin
    input: { id: 1001, name: All of it, shared: false, filter: {} }
    then: 200
    and:
      - it has no condition any more, and shows every email they may see: output.filter == {} && output.count == 20
      - it is personal again: "!output.shared && !seenBy.member.seesBoard(1001)"

  - when: the filter names attributes by a number no attribute of the organisation has
    given: test/base, as member
    input: { id: 1003, name: Elsewhere, shared: false, filter: { attributes: { "9999": ["1"], "1004": ["1"] } } }
    then: 200
    and:
      # 1004 is an attribute of Bureau Sud, 9999 of nobody: "the attributes we know" are those a number names.
      - they are kept as given, and show nothing: output.filter == input.filter && output.count == 0

counterexamples:
  - when: the board is of another organisation
    for: it is a board the member sees
    given: test/base, as outsider
    input: { id: 1001, name: Taken, shared: false, filter: {} }
    then: 404 boards.notFound

  - when: the board is another member's own
    for: it is a board the member sees
    given: test/base, as member
    input: { id: 1002, name: Taken, shared: false, filter: {} }
    then: 404 boards.notFound

  - when: an administrator names a member's own board
    for: it is a board the member sees
    given: test/base, as admin
    input: { id: 1003, name: Taken, shared: false, filter: {} }
    then: 404 boards.notFound

  - when: no board has this number
    for: it is a board the member sees
    given: test/base, as admin
    input: { id: 9999, name: Nothing, shared: false, filter: {} }
    then: 404 boards.notFound

  - when: a member changes a shared board
    for: the member manages it, as its owner or, for a shared one, as an administrator
    given: test/base, as member
    input: { id: 1001, name: Mine now, shared: false, filter: {} }
    then: 403 boards.notYours

  - when: the name is blank
    for: BoardChanged
    given: test/base, as member
    input: { id: 1003, name: "  ", shared: false, filter: {} }
    then: 400 boards.nameRequired

  - when: a member shares their own board
    for: only an administrator makes it shared
    given: test/base, as member
    input: { id: 1003, name: To follow, shared: true, filter: {} }
    then: 403 boards.sharedByAdministrators
