name: CheckPasswordReset
agent: Visitor
entry: POST /api/auth/password-reset/check
description: >-
  Someone opens a link to choose a new password and is told whose password it
  is for, before ResetPassword.
input: PasswordResetShown
output: PasswordResetOpened

DomPost:
  - (x) the address of the member the link is for is told: output.email == world.passwordReset.email
  - (x) nothing changes - the link stays live: nothingChanged
ReqPre:
  - ( ) the origin is not locked out
  - (+) the link is live - not used, not replaced, less than an hour old
ReqPost:
  - ( ) a link that opens nothing counts as a wrong guess

examples:
  - when: the member opens their link
    given: test/base, as visitor
    input: "{ token: world.passwordReset.token }"
    then: 200

  - when: the link is opened in a browser where somebody of another organisation is signed in
    given: test/base, as outsider
    input: "{ token: world.passwordReset.token }"
    then: 200

counterexamples:
  - when: the link opens nothing
    for: the link is live - not used, not replaced, less than an hour old
    given: test/base, as visitor
    input: { token: not-the-link-of-milo }
    then: 404 auth.resetInvalid

  - when: the link is empty
    for: the link is live - not used, not replaced, less than an hour old
    given: test/base, as visitor
    input: { token: "" }
    then: 404 auth.resetInvalid
