name: ChangePassword
agent: Member
entry: PUT /api/auth/password
description: >-
  A member replaces the password they sign in with.
input: PasswordChanged
output: Done

DomPost:
  - (+) the member's password is the new one: >-
      account(old.me.email).password_hash != old.account(old.me.email).password_hash
  - (x) the member's other sessions are closed, only the one that made the change stays: >-
      signedInAs(old.me.email)
      && !seenBy.admin.signedInAs(old.me.email) && !seenBy.member.signedInAs(old.me.email)
  - (+) of all the sessions they had, on any browser, one is left: >-
      let mine = old.seenBy.admin.memberWith(old.me.email).id in
      me != null && count(sessionsOf(mine)) == 1
ReqPre:
  - (x) the requester is signed in
  - ( ) the origin is not locked out
  - (x) the member gives their current password: input.current == world.requester.password
  - (x) the new one has ten characters or more: length(input.next) >= 10
ReqPost:
  - ( ) a wrong current password counts as a wrong guess
  - (x) every other member is told of themselves what they were
  - (+) nothing of another member changes
  - (x) the sessions of the other members stay open: seenBy.coadmin.me != null && seenBy.outsider.me != null
  - (+) no session of another member is closed, on any browser: >-
      let mine = old.seenBy.admin.memberWith(old.me.email).id in
      among(filter(old.db.sessions, s ~> s.user_id != mine), db.sessions)

examples:
  - when: a member changes their password, signed in on another browser too
    given: test/base, as member
    input: { current: a-password-for-the-tests, next: another-password }
    then: 200
    and:
      - their other browser is signed out: old.seenBy.member.me != null && seenBy.member.me == null
      - an administrator stays signed in: seenBy.admin.me != null
      - (+) the link to a new password they were given stays good: db.password_resets == old.db.password_resets

  - when: an administrator changes theirs, for one of ten characters
    given: test/base, as admin
    input: { current: a-password-for-the-tests, next: "1234567890" }
    then: 200

counterexamples:
  - when: the current password given is not theirs
    for: the member gives their current password
    given: test/base, as member
    input: { current: not-the-password-of-milo, next: another-password }
    then: 401 auth.wrongPassword

  - when: the new password has nine characters
    for: the new one has ten characters or more
    given: test/base, as member
    input: { current: a-password-for-the-tests, next: "123456789" }
    then: 400 auth.passwordTooShort
