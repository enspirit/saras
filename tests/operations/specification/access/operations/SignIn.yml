name: SignIn
agent: Visitor
entry: POST /api/auth/login
description: >-
  A visitor proves who they are and becomes a signed-in member.
input: Credentials
output: Admitted

DomPost:
  - (x) the member with this address is admitted, a session is opened for them: >-
      signedInAs(lower(trim(input.email)))
  - (+) one session is opened, and no more: count(db.sessions) == count(old.db.sessions) + 1
ReqPre:
  - ( ) the origin is not locked out
  - (+) the address and the password are those of a member: >-
      hasAccount(lower(trim(input.email)))
      && input.password == world.password
ReqPost:
  - ( ) a refusal does not say which of the two was wrong, and counts as a wrong guess
  - ( ) where the installation requires a second factor, no session is opened before it is given
  - (x) the sessions there were stay open: seenBy.admin.me != null && seenBy.outsider.me != null
  - (+) no session of anybody is closed, on any browser: among(old.db.sessions, db.sessions)

examples:
  - when: an administrator signs in, their address typed with capitals
    given: test/base, as visitor
    input: { email: " Ada@Atelier.example ", password: a-password-for-the-tests }
    then: 200
    and:
      - no second factor is asked, the stack requiring none: output.ok && output.secondFactor == null
      - they are who they were in their organisation: me.role == 'admin' && me.organization.name == 'Atelier Nord'

  - when: a member signs in
    given: test/base, as visitor
    input: { email: milo@atelier.example, password: a-password-for-the-tests }
    then: 200
    and:
      - they are a member of their organisation, and not an administrator: me.role == 'user' && me.organization.name == 'Atelier Nord'

  - when: somebody signs in on a browser where another member is signed in
    given: test/base, as member
    input: { email: otto@bureau.example, password: a-password-for-the-tests }
    then: 200
    and:
      - the browser is now theirs: old.me.email == 'milo@atelier.example' && me.organization.name == 'Bureau Sud'

counterexamples:
  - when: the password is not theirs
    for: the address and the password are those of a member
    given: test/base, as visitor
    input: { email: ada@atelier.example, password: not-the-password-of-ada }
    then: 401 auth.invalidCredentials

  - when: nobody has this address
    for: the address and the password are those of a member
    given: test/base, as visitor
    input: { email: nobody@atelier.example, password: a-password-for-the-tests }
    then: 401 auth.invalidCredentials

  - when: the password is empty
    for: the address and the password are those of a member
    given: test/base, as visitor
    input: { email: ada@atelier.example, password: "" }
    then: 401 auth.invalidCredentials
