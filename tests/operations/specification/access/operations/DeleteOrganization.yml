name: DeleteOrganization
agent: Administrator
entry: DELETE /api/organization
description: >-
  An administrator deletes the organisation and all saras holds for it.
input: OrganizationLeft
output: Done

DomPre:
  - ( ) the requester's organisation exists
DomPost:
  - (+) the organisation is gone: >-
      count(db.organizations) == count(old.db.organizations) - 1
      && among(db.organizations, old.db.organizations)
ReqPre:
  - (x) the requester is signed in
  - (x) the requester is an administrator
  - ( ) the origin is not locked out
  - (x) the member gives their current password: input.password == world.requester.password
  - (x) the member gives the organisation's name, as it is - spaces around and letter case aside: >-
      lower(trim(input.name | '')) == lower(trim(me.organization.name))
ReqPost:
  - (x) with its members and their sessions: >-
      me == null && seenBy.coadmin.me == null && seenBy.member.me == null
  - (+) no account is left for their addresses, and no session of theirs, on any browser: >-
      !any(old.members, m ~> hasAccount(m.email))
      && !any(db.sessions, s ~> old.seesMember(s.user_id))
  - (+) with its invitations, its prompts and its mailboxes: >-
      !any(db.invitations, i ~> old.seesInvitation(i.id))
      && !any(db.prompts, p ~> old.seesPrompt(p.id))
      && !any(db.accounts, a ~> old.seesMailbox(a.id))
  - (+) with the emails, proposals and replies kept from them: >-
      !any(db.emails, e ~> old.seesEmail(e.id))
      && !any(db.drafts, d ~> old.seesEmail(d.email_id))
      && !any(db.replies, r ~> old.seesEmail(r.email_id))
  - ( ) a wrong password counts as a wrong guess
  - ( ) nothing changes in the mailboxes themselves
  - ( ) the other members are not told - they find themselves signed out

examples:
  - when: an administrator deletes Atelier Nord, typing its name their way
    given: test/base, as admin
    input: "{ password: world.password, name: ' atelier NORD ' }"
    then: 200
    and:
      - the other administrator and the user find themselves signed out: >-
          old.seenBy.coadmin.me != null && seenBy.coadmin.me == null
          && old.seenBy.member.me != null && seenBy.member.me == null
      - (+) their addresses are free again, and so are those it invited: >-
          addresses(db.users) == ['otto@bureau.example'] && count(db.invitations) == 0
      - what another organisation is told is as it was: seenBy.outsider == old.seenBy.outsider

counterexamples:
  - when: the password given is not theirs
    for: the member gives their current password
    given: test/base, as admin
    input: { password: not-the-password-of-ada, name: Atelier Nord }
    then: 401 auth.wrongPassword

  - when: the name given is not the organisation's
    for: the member gives the organisation's name, as it is - spaces around and letter case aside
    given: test/base, as admin
    input: "{ password: world.password, name: 'Atelier' }"
    then: 400 organization.nameMismatch

  - when: no name is given
    for: the member gives the organisation's name, as it is - spaces around and letter case aside
    given: test/base, as admin
    input: "{ password: world.password }"
    then: 400 organization.nameMismatch
