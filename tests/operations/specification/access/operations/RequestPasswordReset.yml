name: RequestPasswordReset
agent: Visitor
entry: POST /api/auth/password-reset
description: >-
  Someone who lost their password asks for a link to choose a new one, sent to
  their address.
input: PasswordResetAsked
output: Done

DomPre:
  - ( ) the link is not made yet
DomPost:
  - (+) if the address is a member's, a link to choose a new password exists for them, and one only: >-
      let asking = old.seenBy.admin.memberWith(lower(trim(input.email))) in
      asking == null || count(resetLinksOf(asking.id)) == 1
ReqPre:
  - (x) this server was given a way to send mail: public.passwordResetByEmail
ReqPost:
  - ( ) it was sent to that address
  - (x) the answer is the same whether the address is a member's or not: "output == { ok: true }"
  - (+) nothing is made for an address nobody has: >-
      old.hasAccount(lower(trim(input.email)))
      || nothingChanged
  - (+) the links of the other members are as they were: >-
      let asking = old.seenBy.admin.memberWith(lower(trim(input.email))) in
      among(old.resetLinksOfOthers(asking.id), db.password_resets)
  - ( ) the link is good once, for an hour, and only its hash is kept
  - ( ) asking again within two minutes sends nothing more
  - ( ) a letter that cannot be sent is not told to who asked
  - (x) nobody is signed in or out by it: me == old.me && seenBy.admin.me != null && seenBy.member.me != null
  - (+) no session is opened or closed, for anybody: db.sessions == old.db.sessions

examples:
  - when: an administrator who lost their password asks, their address typed with capitals
    given: test/base, as visitor
    input: { email: Ada@Atelier.example }
    then: 200
    and:
      - (+) a link is made that was not there: count(db.password_resets) == count(old.db.password_resets) + 1
      - (+) their password is as it was until they choose another: db.users == old.db.users

  - when: nobody has the address
    given: test/base, as visitor
    input: { email: nobody@atelier.example }
    then: 200
    and:
      - (+) no link is made: db.password_resets == old.db.password_resets

  - when: a member who was given a link a moment ago asks again
    given: test/base, as visitor
    input: "{ email: world.passwordReset.email }"
    then: 200
    and:
      - (+) the link they have is the one they had: db.password_resets == old.db.password_resets
