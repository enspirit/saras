name: ResetPassword
agent: Visitor
entry: PUT /api/auth/password-reset
description: >-
  Someone holding a link to choose a new password chooses it.
  CheckPasswordReset tells first whose password the link is for.
input: PasswordChosen
output: Done

# The live link of the Backgrounds is milo's, who is `member`.
DomPost:
  - (+) the member's password is the new one: >-
      account(world.passwordReset.email).password_hash != old.account(world.passwordReset.email).password_hash
  - (+) the link is spent: count(db.password_resets) == count(old.db.password_resets) - 1
  - (x) all their sessions are closed: old.seenBy.member.me != null && seenBy.member.me == null
ReqPre:
  - ( ) the origin is not locked out
  - (+) the link is live - not used, not replaced, less than an hour old
  - (x) the new password has ten characters or more: length(input.password) >= 10
ReqPost:
  - ( ) a link that opens nothing counts as a wrong guess
  - (x) nobody is signed in by it: me == null
  - ( ) the member signs in afterwards, second factor included where required
  - (x) nothing of any other member changes: >-
      seenBy.admin.me != null && seenBy.admin.me == old.seenBy.admin.me
      && seenBy.admin.membersBut(world.passwordReset.email) == old.seenBy.admin.membersBut(world.passwordReset.email)
      && seenBy.outsider.me == old.seenBy.outsider.me
      && seenBy.outsider.members == old.seenBy.outsider.members
  - (+) what is kept of them is as it was, their password with it, in every organisation: >-
      among(filter(old.db.users, u ~> u.email != world.passwordReset.email), db.users)

examples:
  - when: the member chooses a new password with their link
    given: test/base, as visitor
    input: "{ token: world.passwordReset.token, password: 'another-password' }"
    then: 200

counterexamples:
  - when: the link opens nothing
    for: the link is live - not used, not replaced, less than an hour old
    given: test/base, as visitor
    input: { token: not-the-link-of-milo, password: another-password }
    then: 404 auth.resetInvalid

  - when: the new password has nine characters
    for: the new password has ten characters or more
    given: test/base, as visitor
    input: "{ token: world.passwordReset.token, password: '123456789' }"
    then: 400 auth.passwordTooShort
