name: CreatePasswordResetLink
agent: Administrator
entry: POST /api/members/:id/password-reset
description: >-
  An administrator gets, for a member who lost their password, a link to
  choose a new one, to hand to them.
input: MemberNamed
output: PasswordResetLink

DomPre:
  - (x) the member named is a member of the requester's organisation
DomPost:
  - (+) a link to choose a new password exists for them, replacing any earlier one: >-
      count(resetLinksOf(input.id)) == 1
      && !any(resetLinksOf(input.id), a ~> any(old.db.password_resets, b ~> b.token_hash == a.token_hash))
ReqPre:
  - (x) the requester is signed in
  - (x) the requester is an administrator
ReqPost:
  - (x) the link is told once, here, good for an hour: contains(output.link, '/#/reset-password/') && output.validMinutes == 60
  - ( ) the link is good once
  - (+) only its hash is kept: all(db.password_resets, r ~> !isBlank(r.token_hash) && !contains(output.link, r.token_hash))
  - (x) their sessions stay open: >-
      let theirs = member(input.id).email in
      signedInAs(theirs) || seenBy.coadmin.signedInAs(theirs) || seenBy.member.signedInAs(theirs)
  - (+) their password is as it was until they choose another, and no session is opened or closed, for anybody: >-
      db.users == old.db.users && db.sessions == old.db.sessions
  - (+) the links of the other members are as they were: resetLinksOfOthers(input.id) == old.resetLinksOfOthers(input.id)

examples:
  - when: an administrator asks for a link for milo, who has one already
    given: test/base, as admin
    input: { id: 1003 }
    then: 201
    and:
      - (+) he had one, and has one: >-
          count(old.resetLinksOf(input.id)) == 1
          && count(db.password_resets) == count(old.db.password_resets)

counterexamples:
  - when: the member is another organisation's
    for: the member named is a member of the requester's organisation
    given: test/base, as admin
    input: { id: 1004 }
    then: 404 members.notFound
