name: RenewMailboxCredentials
agent: Member
entry: PUT /api/mailboxes/:id/password
description: >-
  The one who manages a mailbox reached by its servers gives saras access to
  it again, after a password change. The servers and the user name are kept.
input: MailboxPassword
output: Done

DomPost:
  - (x) the same mailbox: count(mailboxes) == count(old.mailboxes)
  - (+) the credentials kept for it are no longer what they were: >-
      withId(db.accounts, input.id).config_enc != withId(old.db.accounts, input.id).config_enc
  - (x) its last error is forgotten: mailbox(input.id).lastError == null
ReqPre:
  - (x) the requester is signed in
  - (x) the requester may use the mailbox
  - (x) the requester manages the mailbox
  - (x) the mailbox is reached by its servers
  - (x) a password is given: length(input.password | '') > 0
  # On this stack, the password that works is that of the mailbox of world/mailbox.
  - (x) the new credentials were just seen to work, for that very mailbox: >-
      length(input.password | '') == 0 || input.password == 'testpass'
ReqPost:
  - (+) the credentials are kept sealed: >-
      !contains(withId(db.accounts, input.id).config_enc, input.password)
  - (x) the folder watched and the emails kept do not change: >-
      let b = old.mailbox(input.id), a = mailbox(input.id)
      in sameWatch(a, b) && a.todo == b.todo && emails == old.emails
  - ( ) who owns the mailbox does not change
  - (x) its address, its name, and that it is shared or not, do not change: >-
      let b = old.mailbox(input.id), a = mailbox(input.id)
      in a.kind == b.kind && a.email == b.email && a.displayName == b.displayName && a.shared == b.shared && a.canManage == b.canManage
  - (x) who may use it, and who manages it, do not change: >-
      seenBy.member.onlyUses(input.id) && seenBy.coadmin.manages(input.id) && !seenBy.outsider.seesMailbox(input.id)
ReqTrig:
  - a mailbox that watches a folder is fetched at once

examples:
  - when: the administrator who connected the mailbox gives its password again
    given: test/base, as admin
    input: { id: 1001, password: testpass }
    then: 200

  - when: another administrator does, for a shared mailbox
    given: test/base, as coadmin
    input: { id: 1001, password: testpass }
    then: 200

counterexamples:
  # These three come first, and are told of no mailbox: the fetch an example started
  # may still be under way, and ends on the mailbox of the Background.
  - when: the organisation has no mailbox
    for: the requester may use the mailbox
    given: test/unconnected, as admin
    input: { id: 1001, password: testpass }
    then: 404 mailboxes.notFound

  - when: what is given as its number is not one
    for: the requester may use the mailbox
    given: test/unconnected, as coadmin
    input: { id: not-a-number, password: testpass }
    then: 404 mailboxes.notFound

  - when: a member who is not an administrator asks, of a number no mailbox has
    for: the requester may use the mailbox
    given: test/unconnected, as member
    input: { id: 4242, password: testpass }
    then: 404 mailboxes.notFound

  - when: no password is given
    for: a password is given
    given: test/base, as admin
    input: { id: 1001 }
    then: 400 mailboxes.passwordRequired

  - when: the password is not the mailbox's
    for: the new credentials were just seen to work, for that very mailbox
    given: test/base, as admin
    input: { id: 1001, password: not-the-password }
    then: 400 mailboxes.connectionFailed
