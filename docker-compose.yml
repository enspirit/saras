services:
  saras:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - saras-data:/data
      # Your brand: uncomment, and add BRAND_DIR=/brand to .env
      # - ./brands/example:/brand:ro

volumes:
  saras-data:
