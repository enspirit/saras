services:
  mailia:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - mailia-data:/data
      # Votre marque : décommentez, et ajoutez BRAND_DIR=/brand dans .env
      # - ./brands/exemple:/brand:ro

volumes:
  mailia-data:
