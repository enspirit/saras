name: Tests

# Nothing here duplicates a command. Every step calls an `emb` task that lives
# in .emb.yml or in a component's Embfile.yml, so CI runs what a developer runs.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What needs a checkout and nothing else.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # No later step pushes or fetches: the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: software/saras/package-lock.json
      - run: npm install -g @enspirit/emb
      - run: emb run setup
      - run: emb run lint
      - run: emb run build
      # Starts local IMAP, SMTP and OpenRouter stand-ins, on the embedded PostgreSQL:
      # no secret and no outside service needed.
      - run: emb run test

  # What needs the running stack. The runner needs docker and emb: each suite
  # runs in a container of the stack.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # base + test: no published port, every suite inside a container on the
      # compose network. Beats the value in .env.commons.
      COMPOSE_FILE: docker-compose.base.yml:docker-compose.test.yml
    steps:
      - uses: actions/checkout@v5
        with:
          # No later step pushes or fetches: the token is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @enspirit/emb
      # The folder the operations suite writes its report to, owned by the runner's user: Docker
      # would make it root's, and the suite, which is not root, could not write there.
      - run: emb run report:prepare
      - run: emb up
      - run: emb ps
      # The operations over HTTP once more, against a PostgreSQL server, as in production.
      - run: emb run test:postgres
      # The demo still stands: its seed fits the schema the server creates, and
      # its mailbox is connected and fetched.
      - run: emb run demo
      # The operations as their clauses say them, through the front door, from a
      # container of its own. Last of the suites: every case installs a seed,
      # which empties the database of this stack.
      - run: emb run test:operations
      # The image that ships: nothing else in CI builds that target.
      - run: emb resources build --flavor production --publishable
      - if: always()
        run: emb logs archive
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: .emb/*/logs/**/*.log
          if-no-files-found: ignore
      - if: always()
        run: emb down

  # The image on Docker Hub, once both jobs above are green: from main
  # (enspirit/saras:latest and :sha-<commit>) and from a version tag (v1.2.3 ->
  # :1.2.3 and :1.2). The only job that reads a secret, and no pull request
  # reaches it. The steps before the last one give the runner what a laptop
  # has: emulation for the other architecture, a builder, a login.
  publish:
    needs: [test, stack]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @enspirit/emb
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - run: emb run publish
