name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Starts local IMAP, SMTP and OpenRouter stand-ins, on the embedded PostgreSQL:
      # no secret and no outside service needed.
      - run: npm test

  # The same suite against a PostgreSQL server, as in production.
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saras
          POSTGRES_PASSWORD: saras
          POSTGRES_DB: saras
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saras -d saras"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://saras:saras@localhost:5432/saras

  # The Docker image: built on every pull request, pushed to Docker Hub from main and from version tags.
  #   main    -> enspirit/saras:latest and :sha-<commit>
  #   v1.2.3  -> enspirit/saras:1.2.3 and :1.2
  image:
    needs: [test, test-postgres]
    if: >-
      github.event_name == 'pull_request'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
        if: env.PUSH == 'true'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/enspirit/saras
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests only check that the image builds: one platform, nothing pushed.
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
