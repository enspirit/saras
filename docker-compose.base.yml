# The stack. What each component *is* and what it needs before it starts —
# nothing about laptops, ports or dev-loop mounts, which are the overlays' job.
#
# Each component's env/base.env is listed here: what it is configured by, in
# every stack. The overlays add their own files after it, and later files win.
#
#   emb up                                                      base + devel
#   COMPOSE_FILE=docker-compose.base.yml:docker-compose.test.yml emb up
#
# Images are named, never built here: `emb` builds them from each component's
# Embfile.yml, so the target is chosen in one place.

services:
  # -------------------------------------------------------------------------
  # postgres — the database. A third-party image, pinned here and nowhere else.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      # Visibly dev defaults.
      POSTGRES_DB: ${POSTGRES_DB:-saras}
      POSTGRES_USER: ${POSTGRES_USER:-saras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saras}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-saras} -d ${POSTGRES_DB:-saras}']
      interval: 5s
      timeout: 3s
      retries: 20

  # -------------------------------------------------------------------------
  # saras — the server and the interface it serves: the front door, and the
  # only way in. It creates its schema when it starts, so there is no
  # migration to wait for.
  # -------------------------------------------------------------------------
  saras:
    image: saras/saras:${DOCKER_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./software/saras/env/base.env
    environment:
      # Beats every env file. Interpolated, never retyped: the same variables postgres reads.
      DATABASE_URL: postgres://${POSTGRES_USER:-saras}:${POSTGRES_PASSWORD:-saras}@postgres:5432/${POSTGRES_DB:-saras}
    healthcheck:
      # What visitors are told is read from the database: an answer means the
      # server is up and reaches it.
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/public').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # -------------------------------------------------------------------------
  # mailbox — a member's mailbox, as the stack meets it: an IMAP server holding
  # sample emails and an SMTP server that sends nothing (world/mailbox).
  #
  # In the network of saras, not beside it: saras refuses a mail server
  # without TLS unless it is one of its own machine, and this one listens on
  # 127.0.0.1 there (doc/decisions/0005). Nothing else reaches it.
  # Never published and never deployed.
  # -------------------------------------------------------------------------
  mailbox:
    image: saras/mailbox:${DOCKER_TAG:-latest}
    network_mode: service:saras
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('node:net').connect(1143,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # fakesmtp — the mail server saras hands its own mail to (the link of a lost
  # password), as the stack meets it: it accepts everything on port 25,
  # delivers nothing, and shows what it was given on port 1080.
  # Never published and never deployed.
  # -------------------------------------------------------------------------
  fakesmtp:
    image: saras/fakesmtp:${DOCKER_TAG:-latest}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:1080/api/emails']
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # storage — dbagent, long-running: `emb run storage:…` execs here. It owns
  # the seeds (software/storage/data), the datasets the database is put into.
  #
  # Named `storage` rather than `dbagent` because emb picks a task's container
  # by matching the service name to the component name.
  #
  # It waits for saras, not the reverse: the schema is the server's, created
  # when it starts (doc/decisions/0001), and a seed needs its tables.
  #
  # Never deployed, never routed, no published port: its seed endpoint empties
  # tables.
  # -------------------------------------------------------------------------
  storage:
    image: enspirit/dbagent:3.11.0
    depends_on:
      saras:
        condition: service_healthy
    environment:
      # Interpolated, never retyped: the same variables postgres reads.
      DBAGENT_HOST: postgres
      DBAGENT_DB: ${POSTGRES_DB:-saras}
      DBAGENT_USER: ${POSTGRES_USER:-saras}
      DBAGENT_PASSWORD: ${POSTGRES_PASSWORD:-saras}
      DBAGENT_SUPER_USER: ${POSTGRES_USER:-saras}
      DBAGENT_SUPER_PASSWORD: ${POSTGRES_PASSWORD:-saras}
    volumes:
      # What it is: its seeds. Writable, because `db.flush` writes a seed by
      # dumping the database; read-only under the suites.
      - ./software/storage/data:/home/app/data
    healthcheck:
      # /ping tests the database connection, not only the web server.
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:9292/ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # webspicy — the black-box specification of the API. It sleeps, and the
  # suite is `exec`ed into it. Not published to any registry.
  # -------------------------------------------------------------------------
  webspicy:
    image: saras/webspicy:${DOCKER_TAG:-latest}
    env_file:
      - ./tests/webspicy/env/base.env
    depends_on:
      saras:
        condition: service_healthy

volumes:
  postgres-data:
